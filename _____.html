<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>মেমরি ম্যাচ — মজার কার্ড গেম</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --dark: #1e293b;
      --light: #f1f5f9;
      --border: #e2e8f0;
      --shadow: rgba(99, 102, 241, 0.1);
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--dark);
    }
    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 32px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      font-size: clamp(28px, 6vw, 42px);
      margin-bottom: 24px;
      text-shadow: 2px 2px 4px var(--shadow);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--light);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 2px solid var(--border);
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      border: 3px solid transparent;
      user-select: none;
    }
    .card:hover:not(.flipped):not(.matched) {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px var(--shadow);
    }
    .card.flipped, .card.matched {
      background: white;
      border-color: var(--primary);
    }
    .card.matched {
      background: var(--success);
      border-color: var(--success);
      animation: match 0.5s ease;
    }
    .card-back {
      color: white;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-front {
      display: none;
    }
    .card.flipped .card-back, .card.matched .card-back { display: none; }
    .card.flipped .card-front, .card.matched .card-front { display: flex; }
    @keyframes match {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1) rotate(5deg); }
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px var(--shadow);
    }
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--shadow);
    }
    .btn:active { transform: translateY(0); }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: modalIn 0.4s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal h2 {
      color: var(--success);
      font-size: 36px;
      margin-bottom: 16px;
    }
    .modal p {
      color: #64748b;
      font-size: 18px;
      margin: 12px 0;
    }
    .modal .btn { margin-top: 20px; }
    @media (max-width: 600px) {
      .container { padding: 20px; }
      .game-board { gap: 8px; }
      .card { font-size: 36px; border-width: 2px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 মেমরি ম্যাচ</h1>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-label">সময়</div>
        <div class="stat-value" id="timer">০:০০</div>
      </div>
      <div class="stat">
        <div class="stat-label">মুভ</div>
        <div class="stat-value" id="moves">০</div>
      </div>
      <div class="stat">
        <div class="stat-label">জোড়া</div>
        <div class="stat-value" id="matches">০/৮</div>
      </div>
    </div>

<div class="game-board" id="gameBoard"></div>

<div class="controls">
      <button class="btn" id="resetBtn">🔄 নতুন গেম</button>
    </div>
  </div>

<div class="modal" id="winModal">
    <div class="modal-content">
      <h2>🎉 অভিনন্দন!</h2>
      <p>আপনি জিতেছেন!</p>
      <p><strong id="finalMoves">০</strong> মুভে</p>
      <p><strong id="finalTime">০:০০</strong> সময়ে</p>
      <button class="btn" id="playAgainBtn">আবার খেলুন</button>
    </div>
  </div>

<script>
    const emojis = ['🎮', '🎯', '🎨', '🎭', '🎪', '🎸', '🎺', '🎹'];
    const bn = new Intl.NumberFormat('bn-BD');
    
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer = 0;
    let timerInterval = null;
    let gameStarted = false;

const $ = id => document.getElementById(id);
    const gameBoard = $('gameBoard');
    const timerEl = $('timer');
    const movesEl = $('moves');
    const matchesEl = $('matches');
    const winModal = $('winModal');
    const resetBtn = $('resetBtn');
    const playAgainBtn = $('playAgainBtn');

function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${bn.format(mins)}:${bn.format(secs).padStart(2, '০')}`;
    }

function startTimer() {
      if (!gameStarted) {
        gameStarted = true;
        timerInterval = setInterval(() => {
          timer++;
          timerEl.textContent = formatTime(timer);
        }, 1000);
      }
    }

function stopTimer() {
      clearInterval(timerInterval);
      gameStarted = false;
    }

function createCard(emoji, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.dataset.index = index;
      card.innerHTML = `
        <div class="card-back">❓</div>
        <div class="card-front">${emoji}</div>
      `;
      card.addEventListener('click', () => flipCard(card));
      return card;
    }

function flipCard(card) {
      if (flippedCards.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
        return;
      }

startTimer();
      card.classList.add('flipped');
      flippedCards.push(card);

if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = bn.format(moves);
        checkMatch();
      }
    }

function checkMatch() {
      const [card1, card2] = flippedCards;
      const match = card1.dataset.emoji === card2.dataset.emoji;

setTimeout(() => {
        if (match) {
          card1.classList.add('matched');
          card2.classList.add('matched');
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          matchedPairs++;
          matchesEl.textContent = `${bn.format(matchedPairs)}/৮`;

if (matchedPairs === emojis.length) {
            setTimeout(showWin, 500);
          }
        } else {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
        }
        flippedCards = [];
      }, 800);
    }

function showWin() {
      stopTimer();
      $('finalMoves').textContent = `${bn.format(moves)} মুভ`;
      $('finalTime').textContent = formatTime(timer);
      winModal.classList.add('show');
    }

function initGame() {
      gameBoard.innerHTML = '';
      cards = shuffle([...emojis, ...emojis]);
      cards.forEach((emoji, index) => {
        gameBoard.appendChild(createCard(emoji, index));
      });

flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      timer = 0;
      stopTimer();

timerEl.textContent = '০:০০';
      movesEl.textContent = '০';
      matchesEl.textContent = '০/৮';
      winModal.classList.remove('show');
    }

resetBtn.addEventListener('click', initGame);
    playAgainBtn.addEventListener('click', initGame);

initGame();
  </script>
</body>
</html>
